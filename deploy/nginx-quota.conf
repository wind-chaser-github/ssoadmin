    # Dedicated quota sidecar; core SSO and all English routes retain port 8001.
    location ^~ /sso/admin/quotas/ {
        proxy_pass http://127.0.0.1:5191/admin/quotas/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location = /sso/api/quota/consume {
        proxy_pass http://127.0.0.1:5191/api/quota/consume;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location ~ ^/sso/auth/users/[0-9]+/apps/(?!seth-english/)[a-z0-9-]+/quota$ {
        proxy_pass http://127.0.0.1:5191;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
